name: Build Legacy Sodium

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # Gradle/Loom run on Java 17; build.gradle targets Java 8 bytecode
      # for Minecraft 1.8.9 compatibility.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew --no-daemon clean build

      - name: Upload development JAR
        uses: actions/upload-artifact@v4
        with:
          name: legacy-sodium-1.8.9
          path: |
            build/libs/legacy-sodium-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Legacy Sodium ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/libs/legacy-sodium-*.jar
            !build/libs/*-sources.jar
